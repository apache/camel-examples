camel.main.name=trip-{{role}}
camel.main.shutdown-timeout=5
camel.server.enabled=true
camel.server.host=127.0.0.1
camel.server.port={{port}}
role=coordinator
port=8080

# Any service implementing the TypeSafe AI decision HTTP contract.
# Local containers use the public demo key; hosted services require their own key.
camel.component.typesafe-ai.base-url={{env:DECISION_BASE_URL:http://127.0.0.1:8100}}
camel.component.typesafe-ai.api-path={{env:DECISION_API_PATH:/v1/systemone}}
camel.component.typesafe-ai.api-key={{env:DECISION_API_KEY:local-demo}}
camel.component.typesafe-ai.model={{env:DECISION_MODEL:jev-latest}}
camel.component.typesafe-ai.request-timeout={{env:DECISION_TIMEOUT:120000}}

routing.fan-out-threshold={{env:DECISION_FAN_OUT_THRESHOLD:0.5}}
routing.minimum-probability={{env:DECISION_MIN_PROBABILITY:0.55}}
routing.max-attempts=3
agents.reservation.url=http://127.0.0.1:8081
agents.weather.url=http://127.0.0.1:8082
agents.cost.url=http://127.0.0.1:8083
agents.general.url=http://127.0.0.1:8084

# The specialists and coordinator merge step share an OpenAI-compatible chat service.
camel.component.openai.model={{env:OPENAI_MODEL:gpt-4o}}
camel.component.openai.base-url={{env:OPENAI_BASE_URL:https://api.openai.com/v1}}
# The coordinator also needs the generation API key when combining several replies.
camel.component.openai.api-key={{env:OPENAI_API_KEY:}}

# These are endpoint options, referenced by each specialist route.
openai.temperature=0.3
openai.request-timeout=60000
