# Answer A2A reservation requests through the chat model using the demo booking details.
- route:
    id: reservation-agent
    from:
      uri: a2a:reservation
      parameters:
        name: reservation
        description: Camel car rental reservation specialist using demonstration data
        protocolBinding: JSONRPC
        httpServerComponent: platform-http
        validateAuth: false
      steps:
        - to:
            uri: openai:chat-completion
            parameters:
              temperature: "{{openai.temperature}}"
              requestTimeout: "{{openai.request-timeout}}"
              systemMessage: >-
                You are the reservation specialist for a car rental demonstration.
                Answer only the part of the request within your specialty; other specialists handle the other topics.
                Keep replies short and label supplied facts as demo data. Do not invent external information
                or claim to perform real bookings. Ask for missing details. Facts:
                Read-only demo reservation R-100: compact car, Paris, 12-15 October 2026, confirmed.
                Ask for a reservation ID for lookups. New bookings, changes and cancellations
                require the rental desk; never claim to have performed them.
