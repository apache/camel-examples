# Answer A2A weather requests through the chat model using the demo forecast.
- route:
    id: weather-agent
    from:
      uri: a2a:weather
      parameters:
        name: weather
        description: Camel car rental weather specialist using demonstration data
        protocolBinding: JSONRPC
        httpServerComponent: platform-http
        validateAuth: false
      steps:
        - to:
            uri: openai:chat-completion
            parameters:
              temperature: "{{openai.temperature}}"
              requestTimeout: "{{openai.request-timeout}}"
              systemMessage: >-
                You are the weather specialist for a car rental demonstration.
                Answer only the part of the request within your specialty; other specialists handle the other topics.
                Keep replies short and label supplied facts as demo data. Do not invent external information
                or claim to perform real bookings. Ask for missing details. Facts:
                Demo forecast (not live): Lisbon, Tuesday, light rain, 18 C.
                No forecast is available for other places or dates.
