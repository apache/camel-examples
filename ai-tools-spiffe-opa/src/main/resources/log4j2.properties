appender.out.type = Console
appender.out.name = out
appender.out.layout.type = PatternLayout
appender.out.layout.pattern = %d{HH:mm:ss.SSS} [%-20.20t] %-28.28c{1} %-5p %m%n

# Keep the log focused on what the example is showing. The Camel startup chatter and the HTTP/model client internals
# are turned down to WARN so the story stands out: the callers authenticating, the tools being allowed, and above all
# a tool being denied. The routes log under their route id (assistant, getOrderStatus, refundOrder, ask-assistant, ...),
# which stays at INFO, so those lines are unaffected.
logger.camel.name = org.apache.camel
logger.camel.level = WARN
logger.langchain4j.name = dev.langchain4j
logger.langchain4j.level = WARN
logger.netty.name = io.netty
logger.netty.level = WARN
logger.httpclient.name = org.apache.hc
logger.httpclient.level = WARN

rootLogger.level = INFO
rootLogger.appenderRef.out.ref = out
