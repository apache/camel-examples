# here you can configure options on camel main
# https://camel.apache.org/components/next/others/main.html
# compose.yaml overrides the name of each application with the CAMEL_MAIN_NAME environment variable
camel.main.name = camel-ai-tools-spiffe-opa

# The SPIFFE component connects to the SPIFFE Workload API of the local SPIRE agent. When the option below is not
# set, the address is taken from the SPIFFE_ENDPOINT_SOCKET environment variable (which is what compose.yaml does).
#camel.component.spiffe.spiffe-socket-path = unix:///run/spire/sockets/agent.sock

# The SPIFFE ID of the assistant. A caller asks for a JWT-SVID with the assistant as audience, and the assistant only
# accepts tokens that were minted for it. This is how the assistant knows, unforgeably, who is calling it.
assistant.audience = spiffe://example.org/assistant

# Where the assistant is found (used by the clients)
assistant.host = assistant
assistant.port = 8080

# The Ollama chat model that runs the tool-calling loop. These are read from the environment (OLLAMA_BASE_URL and
# OLLAMA_MODEL) so the same build runs both on the host and in a container; the defaults below are for a local Ollama.
# The model must support tool calling (for example llama3.1, qwen2.5 or mistral).
#   export OLLAMA_BASE_URL=http://localhost:11434
#   export OLLAMA_MODEL=qwen2.5

# What each client asks the assistant, and how often (used by ClientApplication). compose.yaml sets CLIENT_MESSAGE per
# caller, and staggers them with CLIENT_DELAY so their exchanges do not interleave in the log.
client.message = What is the status of order 1002?
client.period = 60s
client.delay = 5s

# How often the assistant logs its own X.509-SVID, to show the workload identity being rotated
identity.period = 60s
