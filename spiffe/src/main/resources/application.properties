# here you can configure options on camel main
# https://camel.apache.org/components/next/others/main.html
# compose.yaml overrides the name of each application with the CAMEL_MAIN_NAME environment variable
camel.main.name = camel-spiffe

# The SPIFFE component connects to the SPIFFE Workload API of the local SPIRE agent. When the option below is not
# set, the address is taken from the SPIFFE_ENDPOINT_SOCKET environment variable (which is what compose.yaml does).
#camel.component.spiffe.spiffe-socket-path = unix:///run/spire/sockets/agent.sock

# The SPIFFE IDs of the services that expose an HTTP API. A caller asks for a JWT-SVID with the service as
# audience, and the service only accepts tokens that were minted for it
backend.audience = spiffe://example.org/backend
inventory.audience = spiffe://example.org/inventory

# Who may call what: the SPIFFE IDs (comma separated) allowed on each route, as <service>.allow.<route id>.
# A route without an allow-list accepts nobody
backend.allow.orders = spiffe://example.org/frontend
backend.allow.audit = spiffe://example.org/auditor
inventory.allow.stock = spiffe://example.org/backend

# Where the services are found
backend.host = backend
backend.port = 8080
inventory.host = inventory
inventory.port = 8080

# How often the frontend reads the orders and the audit trail
frontend.period = 10s
frontend.audit.period = 30s
# How often the frontend presents a token minted for another service, to show that the backend rejects it
frontend.wrongAudience.period = 45s
frontend.wrongAudience = spiffe://example.org/some-other-service

# How often the applications log their X.509-SVID
identity.period = 60s
